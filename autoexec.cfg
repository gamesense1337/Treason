// ----------------------------------------------------------------------------
// ReD's Maxframes config for Treason
// v1.0 | 17 August 2026 | https://github.com/gamesense1337/Treason
// ----------------------------------------------------------------------------
// Recommended launch options: -novid -nojoy -nosteamcontroller -particles 1
// See README.md for details about the optional -particles setting.
// ----------------------------------------------------------------------------

// --------------------------- \\
// Framerate                   \\
// --------------------------- \\

fps_max 0 // Uncapped. Set a limit here if you prefer lower power usage / heat.

// Uncomment one of these for diagnostics.
// net_graph 1
// net_graphproportionalfont 1
// cl_showfps 1

// --------------------------- \\
// Network                     \\
// --------------------------- \\

cl_interp_ratio 2
// cl_interp 0.100000
cl_pred_optimize 2
cl_timeout 60
net_maxpacketdrop 0

cl_timeout 60 // Max client timeout
sv_lan 1 // Protect local servers

// --------------------------- \\
// Shadows                     \\
// --------------------------- \\

r_shadows 0
r_shadowrendertotexture 0
r_shadowmaxrendered 0

// --------------------------- \\
// Ragdolls / physics props    \\
// --------------------------- \\

cl_ragdoll_fade_time 0
cl_ragdoll_forcefade 1
cl_ragdoll_physics_enable 0
g_ragdoll_fadespeed 10000
g_ragdoll_lvfadespeed 10000
ragdoll_sleepaftertime 0

cl_phys_props_enable 0
cl_phys_props_max 0
props_break_max_pieces 0
r_propsmaxdist 1

// Skip jiggle-bone simulation at normal framerates.
// The cvar disables simulation while FPS is below this threshold.
cl_jiggle_bone_framerate_cutoff 1000

// Disable gibs.
violence_agibs 0
violence_hgibs 0
cl_burninggibs 0

// --------------------------- \\
// Materials / model quality   \\
// --------------------------- \\

mat_antialias 0
mat_bumpmap 0
mat_disable_bloom 1
mat_disable_fancy_blending 1
mat_hdr_level 0
mat_motion_blur_enabled 0
mat_phong 0
mat_reducefillrate 1
mat_reduceparticles 1
mat_specular 0
mat_supportflashlight 0
mat_vsync 0

// Treason historically had visual issues with more aggressive texture values.
// Keep 0 as the conservative low-detail value used by the original config.
mat_picmip 0

// Treason's models have shown visual issues when r_rootlod is changed.
// Force a lower active LOD where possible while leaving the root LOD intact.
r_lod 2
r_rootlod 0
lod_TransitionDist -1

// --------------------------- \\
// World detail                \\
// --------------------------- \\

r_ambientboost 0
r_maxdlights 12
r_worldlights 2
r_rimlight 0
r_3dsky 0
r_decals 15
r_decalstaticprops 0
r_decal_cullsize 15
r_drawdetailprops 0
r_drawmodeldecals 0
r_drawflecks 0
r_dynamic 0

// Water rendering.
r_ForceWaterLeaf 1
r_WaterDrawReflection 0
r_waterforceexpensive 0
r_waterforcereflectentities 0

// --------------------------- \\
// Flashlights                 \\
// --------------------------- \\

r_flashlightdepthtexture 0
r_flashlightrender 0
r_flashlightmodels 0
r_flashlightculldepth 0
r_flashlightscissor 0

// --------------------------- \\
// Ropes                       \\
// --------------------------- \\

rope_collide 0
rope_smooth 0
rope_subdiv 0
rope_wind_dist 0

// --------------------------- \\
// Sprays                      \\
// --------------------------- \\

cl_playerspraydisable 1
r_spray_lifetime 0

// --------------------------- \\
// Loaded message              \\
// --------------------------- \\

echo "-------------------------------------------------------"
echo "            ReD's Maxframes config loaded.             "
echo "-------------------------------------------------------"
